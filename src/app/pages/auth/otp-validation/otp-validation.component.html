<div class="body-inner">
  <div class="login-section">
    <div class="container-fluid">
      <div class="row align-items-center min-vh-100">
        
        <!-- Left: Custom Full-Screen Carousel -->
        <div class="col-md-8 d-none d-md-block p-0">
          <div class="custom-carousel">
            <img [src]="currentImage" class="custom-banner fade-in" alt="Carousel Image">
          </div>
        </div>

        <!-- Right: OTP Validation Form -->
        <div class="col-md-4 d-flex align-items-center justify-content-center">
          <div class="card login-card">
            <div class="card-body">

              <!-- Alert System -->
              <div *ngIf="alertMessage" class="alert alert-dismissible fade show" [ngClass]="alertClass" role="alert">
                {{ alertMessage }}
                <button type="button" class="btn-close" (click)="clearAlert()"></button>
              </div>

              <div class="mb-3 text-center">
                <h3>Two-Factor Authentication</h3>
                <p class="text-muted">Enter the code sent to <strong>{{ email }}</strong></p>
              </div>

              <form (ngSubmit)="validateOtp()">
                <div class="form-group">
                  <label for="otp">OTP</label>
                  <input
                    type="number"
                    class="form-control"
                    id="otp"
                    [(ngModel)]="otpCode"
                    name="otpCode"
                    placeholder="Enter the OTP"
                    required
                  />
                </div>
                <div class="mt-3">
                  <button type="submit" class="btn btn-primary btn-block w-100">Validate</button>
                </div>
              </form>
            </div>
          </div>
        </div> <!-- End of Right Form -->
      </div>
    </div>
  </div>
</div>
