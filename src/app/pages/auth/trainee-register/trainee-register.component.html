<div class="body-inner">
  <div class="register-section">
    <div class="container-fluid">
      <div class="row align-items-center min-vh-100">
        
        <!-- Left: Full-Screen Banner Carousel -->
        <div class="col-md-8 d-none d-md-block p-0">
          <div class="custom-carousel">
            <img [src]="currentImage" class="custom-banner fade-in" alt="Carousel Image">
          </div>
        </div>

        <!-- Right: Registration Form -->
        <div class="col-md-4 d-flex align-items-center justify-content-center">
          <div class="card register-card">
            <div class="card-body">
              <div class="mb-3 text-center">
                <h3>User Registration</h3>
                <p class="text-muted">Fill in your details to register.</p>
              </div>
              <form (ngSubmit)="registerTrainee()">
                
                <div class="form-group">
                  <label for="firstName" >Full Name<span class=req-astrix>*</span></label>
                  <input type="text" class="form-control" id="firstName" [(ngModel)]="firstName" name="firstName" required />
                </div>

                <div class="form-group">
                  <label for="email">Email Address<span class=req-astrix>*</span></label>
                  <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" required />
                </div>

                <div class="form-group">
                  <label for="phone">Phone Number<span class=req-astrix>*</span></label>
                  <input type="tel" class="form-control" id="phone" [(ngModel)]="phone" name="phone" required />
                </div>

                <div class="mt-3">
                  <button type="submit" class="btn btn-primary btn-block w-100">Register</button>
                </div>
              </form>
              
              <!-- Register as Trainer Button -->
              <div class="mt-3 text-center">
                <p class="text-muted">Want to become a trainer?</p>
                <a routerLink="/auth/trainer-registration" class="btn no-bg btn-block w-100">Register as Trainer</a>
              </div>

              <div class="mt-4 text-center">
                <small>Already have an account?</small>
                <a routerLink="/auth/login" class="small fw-bold">Login</a>
              </div>
            </div>
          </div>
        </div> <!-- End of Right Form -->
      </div>
    </div>
  </div>
</div>
