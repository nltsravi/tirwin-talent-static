<div class="body-inner">
    <section class="register-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-12">
            <div class="mb-3 text-center">
              <h3>Trainer Registraiton</h3>
              <p class="text-muted">Inspire, educate, and earn—start your journey as a trainer!</p>
            </div>
            <div class="card register-card">
              <div class="card-body">
                
                <!-- Stepper Progress Bar -->
                <div class="stepper">
                  <div *ngFor="let s of steps; let i = index" class="step" [class.active]="step === i+1">
                    <div class="step-circle">{{ i+1 }}</div>
                    <div class="step-title">{{ s }}</div>
                  </div>
                </div>
                <div class="progress">
                  <div class="progress-bar" [style.width.%]="progress"></div>
                </div>
  
                <!-- Step 1: Personal Information -->
                <div *ngIf="step === 1">
                  <h4>Personal Information</h4>
                  <div class="form-group">
                    <label>First Name</label>
                    <input type="text" class="form-control" [(ngModel)]="trainer.firstName" required />
                  </div>
                  <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" class="form-control" [(ngModel)]="trainer.lastName" required />
                  </div>
                  <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" [(ngModel)]="trainer.email" required />
                  </div>
                  <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="form-control" [(ngModel)]="trainer.phone" required />
                  </div>
                </div>
  
                <!-- Step 2: Professional Details -->
                <div *ngIf="step === 2">
                  <h4>Professional Details</h4>
                  <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" class="form-control" [(ngModel)]="trainer.jobTitle" required />
                  </div>
                  <div class="form-group">
                    <label>Company</label>
                    <input type="text" class="form-control" [(ngModel)]="trainer.company" />
                  </div>
                  <div class="form-group">
                    <label>Years of Experience</label>
                    <select class="form-control" [(ngModel)]="trainer.experience">
                      <option *ngFor="let exp of experienceOptions" [value]="exp">{{ exp }}</option>
                    </select>
                  </div>
                </div>
  
                <!-- Step 3: Specialties & Training -->
                <div *ngIf="step === 3">
                  <h4>Training Specialties</h4>
                  <div class="form-group">
                    <label>Specialties</label>
                    <select class="form-control" multiple [(ngModel)]="trainer.specialties">
                      <option *ngFor="let spec of specialtiesOptions" [value]="spec">{{ spec }}</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Training Modes</label>
                    <div>
                      <label><input type="checkbox" [(ngModel)]="trainer.modes.online" /> Online</label>
                      <label><input type="checkbox" [(ngModel)]="trainer.modes.offline" /> Offline</label>
                      <label><input type="checkbox" [(ngModel)]="trainer.modes.hybrid" /> Hybrid</label>
                    </div>
                  </div>
                </div>
  
                <!-- Step 4: Public Profile -->
                <div *ngIf="step === 4">
                  <h4>Public Profile</h4>
                  <div class="form-group">
                    <label>Bio</label>
                    <textarea class="form-control" [(ngModel)]="trainer.bio"></textarea>
                  </div>
                  <div class="form-group">
                    <label>LinkedIn</label>
                    <input type="text" class="form-control" [(ngModel)]="trainer.linkedin" />
                  </div>
                  <div class="form-group">
                    <label>Show Public Profile?</label>
                    <input type="checkbox" [(ngModel)]="trainer.publicProfile" />
                  </div>
                </div>
  
                <!-- Navigation Buttons -->
                <div class="mt-4 text-center">
                  <button *ngIf="step > 1" class="btn btn-secondary" (click)="prevStep()">Back</button>
                  <button *ngIf="step < 4" class="btn btn-primary" (click)="nextStep()">Next</button>
                  <button *ngIf="step === 4" class="btn btn-success" (click)="registerTrainer()">Submit</button>
                </div>
  
              </div>
            </div>
          </div> <!-- End of Form -->
        </div>
      </div>
    </section>
  </div>
