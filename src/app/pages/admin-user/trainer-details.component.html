<div class="container mt-5">
  <div *ngIf="loading">Loading trainer details...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div class="row" *ngIf="!loading && !error && trainer">
    <!-- Left Sidebar -->
    <div class="col-md-4">
      <div class="profile-sidebar p-3 bg-light rounded text-center">
        <ng-container *ngIf="trainer.profile_image || trainer.image; else placeholderImg">
          <img [src]="trainer.profile_image || trainer.image" class="img-fluid mb-3" alt="Trainer Image" style="width:200px;height:200px;object-fit:cover;">
        </ng-container>
        <ng-template #placeholderImg>
          <div style="width:200px;height:200px;background:#e0e0e0;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
            <span style="color:#aaa;font-size:2rem;">200x200</span>
          </div>
        </ng-template>
        <h3>{{ trainer.first_name }} {{ trainer.last_name }}</h3>
        <div *ngIf="trainer.organization" class="org-label text-muted mb-2">
          <i class="fas fa-building"></i> {{ trainer.organization }}
        </div>
        <div class="text-start mt-3">
          <p *ngIf="trainer.email" class="mb-2"><i class="fas fa-envelope"></i> <a [href]="'mailto:' + trainer.email">{{ trainer.email }}</a></p>
          <p *ngIf="trainer.phone" class="mb-2"><i class="fas fa-phone"></i> {{ trainer.phone }}</p>
          <p *ngIf="trainer.experience" class="mb-2"><i class="fas fa-clock"></i> {{ trainer.experience }}</p>
          <div class="social-links mt-2">
            <a *ngIf="trainer.linkedin_profile" [href]="trainer.linkedin_profile" target="_blank" class="btn btn-outline-primary me-2">
              <i class="fab fa-linkedin"></i> LinkedIn
            </a>
          </div>
          <p *ngIf="trainer.expertise && trainer.expertise.length" class="mb-2 mt-3">
            <span *ngFor="let exp of trainer.expertise" class="expertise-tag">
              <i class="fas fa-briefcase"></i> {{ exp }}
            </span>
          </p>
        </div>
      </div>
    </div>
    <!-- Right Side Content -->
    <div class="col-md-8">
      <div class="card p-4 mb-4">
        <p class="text-muted">{{ trainer.job_title }}</p>
        <h5 class="mb-2">Professional Summary</h5>
        <p class="bio">{{ trainer.bio }}</p>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button 
          class="btn btn-success" 
          (click)="onApprove()"
          [disabled]="isApproving"
        >
          <span *ngIf="isApproving">
            <i class="fas fa-spinner fa-spin"></i> Approving...
          </span>
          <span *ngIf="!isApproving">
            <i class="fas fa-check"></i> Approve
          </span>
        </button>
      </div>
    </div>
  </div>
  <div *ngIf="showToastFlag" class="custom-toast">{{ toastMessage }}</div>
</div>
