<div class="container mt-5">
  <div class="row">
    
    <!-- Left Sidebar -->
    <div class="col-md-4">
      <div class="profile-sidebar p-3 bg-light rounded text-center">
        <img [src]="trainer?.image || 'assets/images/default-profile-img'" class="img-fluid mb-3" alt="Trainer Image">
        
        <!-- Upload Profile Picture -->
        <div class="upload-section">
          <input type="file" (change)="onFileSelected($event)" class="form-control mt-2">
          
          <button *ngIf="selectedFile && !isUploading" class="btn btn-primary btn-sm mt-2" (click)="uploadToS3(uploadUrl, trainer.image)">
            Upload
          </button>
          
          <p *ngIf="isUploading" class="text-muted">
            <i class="fas fa-spinner fa-spin"></i> Uploading...
          </p>
        </div>

        <h3>{{ trainer?.name }}</h3>
        <p class="text-muted"><i class="fas fa-user"></i> {{ trainer?.jobTitle }}</p>
        <p class="text-muted"><i class="fas fa-envelope"></i> {{ trainer?.email }}</p>
        <p class="text-muted"><i class="fas fa-phone"></i> {{ trainer?.phone }}</p>

        <!-- Verified Badge -->
        <p *ngIf="trainer?.isVerified" class="text-success"><i class="fas fa-check-circle"></i> Verified</p>
        <p *ngIf="!trainer?.isVerified" class="text-danger"><i class="fas fa-times-circle"></i> Not Verified</p>
      </div>
    </div>

    <!-- Right Side Content -->
    <div class="col-md-8">
      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <!-- Trainer Info -->
      <div class="card p-4 mb-4">
        <h2>{{ trainer?.name }}</h2>
        <p class="text-muted">{{ trainer?.jobTitle }}</p>
        <p class="bio">{{ trainer?.bio }}</p>

        <h5>Contact Information</h5>
        <p>Email: <a [href]="'mailto:' + trainer?.email">{{ trainer?.email }}</a></p>
        <p>Phone: {{ trainer?.phone }}</p>
      </div>
    </div>
  </div>
</div>
